<script>
  // Shared storage backed by a Netlify Function (netlify/functions/store.js),
  // persisted via Netlify Blobs. Every house and chat entry is its own key,
  // so two people saving at the same moment never overwrite each other.
  window.storage = {
    async get(key) {
      try {
        const res = await fetch('/.netlify/functions/store?key=' + encodeURIComponent(key));
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      try {
        const res = await fetch('/.netlify/functions/store', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value }),
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    },
    async list(prefix) {
      try {
        const res = await fetch('/.netlify/functions/store?list=' + encodeURIComponent(prefix || ''));
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    },
  };
</script>
